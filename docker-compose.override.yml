# Auto-loaded by `docker compose up`. Serves the UI with Vite HMR.
# Open http://127.0.0.1:8080 on the host. Vite's "Network" URL is the container IP.
# To use the static nginx client instead:
#   COMPOSE_FILE=docker-compose.yml docker compose up --build
services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: dev
    environment:
      SNOWBALL_API_PROXY: http://api:8000
      SNOWBALL_HMR_CLIENT_PORT: ${SNOWBALL_HTTP_PORT:-8080}
    volumes:
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html
      - ./client/vite.config.ts:/app/vite.config.ts
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${SNOWBALL_HMR_CLIENT_PORT}/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
